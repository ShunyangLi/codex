[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "codex-task-tree"
version = "0.1.0"
description = "Persistent, serial task-tree orchestration for Codex"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12", "openai-codex"]

[project.scripts]
codex-task-tree = "codex_task_tree.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
